name: CI
on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # weekly: catches a plugin or Manim release that breaks a component
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { python-version: ["3.10", "3.11", "3.12"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}", cache: pip, cache-dependency-path: "pyproject.toml" }
      - name: System packages for Manim
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libcairo2-dev libpango1.0-dev pkg-config \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-science dvisvgm
      - run: pip install -e ".[dev]"
      - run: ./scripts/install_plugins.sh   # every community Manim package the components wrap
      - run: pytest                         # fast tests, including a dry run of every component
      - name: catalog.json is up to date
        run: python -m manimate.catalog | diff - catalog.json
      - name: Generated docs and the Claude skill reference are up to date
        run: python scripts/gen_docs.py --check

  slow:
    # Real renders (minutes). Skipped on pull requests to keep them quick; runs on main and weekly.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: "pyproject.toml" }
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libcairo2-dev libpango1.0-dev pkg-config \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-science dvisvgm
      - run: pip install -e ".[dev]"
      - run: ./scripts/install_plugins.sh
      - run: pytest -m slow
